name: Update ktlint

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-ktlint
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the latest stable ktlint release
        run: python3 scripts/sync_version.py --update-ktlint
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/update-ktlint
          delete-branch: true
          commit-message: "build(tooling): update ktlint"
          title: "build(tooling): update ktlint"
          body: |
            Updates the pinned ktlint release used by local formatting and CI.

            Generated by the scheduled ktlint update workflow.
