name: Release Wasmline

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.16.0"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  validate:
    name: validate-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      prerelease: ${{ steps.release-metadata.outputs.prerelease }}
      make_latest: ${{ steps.release-metadata.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag and release inputs
        run: ./scripts/release.sh verify-tag "${GITHUB_REF_NAME}"

      - name: Read GitHub Release metadata
        id: release-metadata
        run: ./scripts/release.sh github-release-metadata >> "$GITHUB_OUTPUT"

      - name: Verify managed versions
        run: ./scripts/wasmline versions check

      - name: Verify AOT compatibility catalog
        run: ./scripts/wasmline aot check

      - name: Verify repository tooling
        run: |
          python3 scripts/tests/test_versions.py
          python3 scripts/tests/test_publications.py
          python3 scripts/tests/test_release.py

      - name: Confirm tag commit is reachable from main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"

      - name: Verify publication credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
        run: |
          for release_secret_name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_CENTRAL_SIGNING_KEY; do
            if [ -z "${!release_secret_name}" ]; then
              echo "::error::Missing repository secret ${release_secret_name}"
              exit 1
            fi
          done

  native-aot-jvm:
    name: validate-native-aot-jvm
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Read toolchain versions
        id: versions
        run: |
          jq -er '.versions.jbr_version' versions.json | sed 's/^/jbr_version=/' >> "$GITHUB_OUTPUT"

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-${{ steps.versions.outputs.jbr_version }}-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: ${{ steps.versions.outputs.jbr_version }}.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install native build dependencies
        run: |
          # Zig cross-compiles and links itself; it only needs the MinGW runtime
          # archives. The compiler package group is ~277 MB and stalled the job.
          sudo timeout 120 apt-get update \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 ||
            echo "apt-get update timed out or failed; continuing with cached indexes" >&2
          sudo timeout 300 apt-get install -y --no-install-recommends \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            mingw-w64-x86-64-dev
          test -f /usr/x86_64-w64-mingw32/lib/libmingwex.a || {
            echo "MinGW runtime archives are missing after install" >&2
            exit 1
          }
          # BSD sort has no -V; sorting by path is enough for version-named directories.
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -1)
          if [ -z "$NDK_DIR" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "MINGW_PATH=/usr/x86_64-w64-mingw32" >> "$GITHUB_ENV"

      - name: Cache Wasmtime platform assets
        uses: actions/cache@v5
        with:
          path: build/platforms
          key: wasmtime-platforms-release-${{ hashFiles('versions.json', 'scripts/config/wasmtime-targets.json') }}

      - name: Download locked Wasmtime assets
        run: ./scripts/wasmline wasmtime download --engine all --jobs 4

      - name: Build JVM and Android engine assets
        run: ./scripts/wasmline jni build --engine all

      - name: Install Rust Component target
        run: rustup target add wasm32-wasip2

      - name: Cache native fixture tools, compilers, and Cargo data
        uses: actions/cache@v5
        with:
          path: |
            ~/.wasmline/tools
            ~/.wasmline/toolchains/wasmtime/compiler-assets
            ~/.cargo/registry
            ~/.cargo/git
          key: native-fixtures-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'aot-compatibility.json', 'wasmline-plugin-core/src/main/resources/META-INF/wasmline/aot/aot-compatibility-lock.json', 'wasmline-plugin-core/src/main/resources/META-INF/wasmline/toolchain/toolchain-lock.json', 'wasmline-native-test-fixtures/src/**') }}

      - name: Run native AOT JVM gate
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WASMLINE_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64/libwasmline.so
        run: >-
          ./gradlew :wasmline:nativeAotJvmTest
          -Pwasmline.native.fixtures.targets=x86_64-linux,pulley64
          --no-daemon

      - name: Run JVM verification tests
        working-directory: .
        env:
          WASMLINE_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64/libwasmline.so
        run: >-
          ./gradlew :wasmline:jvmTest
          :wasmline-loader:jvmTest
          :wasmline-plugin-core:test
          :wasmline-gradle-plugin:test
          :wasmline-bom:check
          :wasmline-kotlin-plugin:test
          :wasmline-cli:test
          --no-daemon

      - name: Run dynamic plugin verification tests
        working-directory: wasmline-plugin-test
        env:
          WASMLINE_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64/libwasmline.so
        run: ./gradlew jvmTest --no-daemon -Pgithub.token="${{ github.token }}"


      - name: Upload verified JVM and Android engine assets
        uses: actions/upload-artifact@v4
        with:
          name: wasmline-jni-assets
          path: |
            wasmline-engine-pulley/src/jvmMain/resources/jni
            wasmline-engine-pulley/src/androidMain/jniLibs
            wasmline-engine-cranelift/src/jvmMain/resources/jni
            wasmline-engine-cranelift/src/androidMain/jniLibs
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish-maven
    needs: [validate, native-aot-jvm, native-aot-ios]
    # Apple targets are declared only on macOS. One publisher produces the root
    # metadata and every target publication, without overwriting Maven versions.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Read toolchain versions
        id: versions
        run: |
          jq -er '.versions.jbr_version' versions.json | sed 's/^/jbr_version=/' >> "$GITHUB_OUTPUT"

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-${{ steps.versions.outputs.jbr_version }}-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: ${{ steps.versions.outputs.jbr_version }}.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install configured Android platform
        run: |
          sdkmanager --list > "${RUNNER_TEMP}/sdkmanager-list.txt"
          package="$(python3 scripts/internal/python/resolve_android_platform.py \
            --compile-sdk "$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["android-compileSdk"])')" \
            --listing-file "${RUNNER_TEMP}/sdkmanager-list.txt")"
          echo "Installing platforms;android-${package}"
          sdkmanager "platforms;android-${package}"

      - name: Download verified JVM and Android engine assets
        uses: actions/download-artifact@v4
        with:
          name: wasmline-jni-assets
          path: .

      - name: Cache Wasmtime platform assets
        uses: actions/cache@v5
        with:
          path: build/platforms
          key: wasmtime-platforms-release-${{ hashFiles('versions.json', 'scripts/config/wasmtime-targets.json') }}

      - name: Download locked Wasmtime assets
        run: ./scripts/wasmline wasmtime download --engine all --jobs 4

      - name: Prepare Kotlin Native cross toolchains
        # Apple targets are declared only on macOS, so the iOS/macOS cinterop
        # tasks exist only on that host. Publication verification requires a
        # cinterop KLIB in every published Native variant.
        run: >-
          ./gradlew :wasmline:cinteropWasmlineLinuxX64
          :wasmline:cinteropWasmlineLinuxArm64
          :wasmline:cinteropWasmlineMingwX64
          :wasmline-engine-pulley:cinteropWasmlineIosArm64
          :wasmline-engine-pulley:cinteropWasmlineIosSimulatorArm64
          :wasmline-engine-pulley:cinteropWasmlineMacosArm64
          :wasmline-engine-cranelift:cinteropWasmlineMacosArm64
          --no-daemon

      - name: Generate all multiplatform publication metadata
        run: >-
          ./gradlew :wasmline:generateMetadataFileForKotlinMultiplatformPublication
          :wasmline-loader:generateMetadataFileForKotlinMultiplatformPublication
          :wasmline-network-ktor:generateMetadataFileForKotlinMultiplatformPublication
          :wasmline-engine-pulley:generateMetadataFileForKotlinMultiplatformPublication
          :wasmline-engine-cranelift:generateMetadataFileForKotlinMultiplatformPublication
          --no-daemon

      - name: Prepare local Maven publications
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Inspect published Native variants
        run: python3 scripts/internal/python/inspect_native_variants.py

      - name: Verify complete Maven publications
        run: ./scripts/release.sh verify-publications --require-apple

      - name: Verify published plugin and native runtime
        working-directory: wasmline-plugin-test
        run: ./gradlew jvmTest -Pwasmline.source=false --no-daemon

      - name: Prepare release assets
        run: ./scripts/release.sh prepare-assets build/release

      - name: Generate release notes
        run: ./scripts/release.sh write-notes build/release-notes.md

      - name: Publish Maven artifacts
        working-directory: .
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-daemon

      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: wasmline-release-inputs
          path: |
            build/release/aot-compatibility.json
            build/release/aot-compatibility.json.sha256
            build/release/wasmline.wit
            build/release/wasmline.wit.sha256
            build/release-notes.md
          if-no-files-found: error
          retention-days: 1
  native-aot-ios:
    name: validate-native-aot-ios
    runs-on: macos-latest
    timeout-minutes: 60
    needs: validate

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read toolchain versions
        id: versions
        run: |
          jq -er '.versions.jbr_version' versions.json | sed 's/^/jbr_version=/' >> "$GITHUB_OUTPUT"

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-${{ steps.versions.outputs.jbr_version }}-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: ${{ steps.versions.outputs.jbr_version }}.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Rust Component target
        run: rustup target add wasm32-wasip2

      - name: Cache iOS Wasmtime and fixture tools
        uses: actions/cache@v5
        with:
          path: |
            build/platforms
            ~/.wasmline/tools
            ~/.wasmline/toolchains/wasmtime/compiler-assets
            ~/.cargo/registry
            ~/.cargo/git
          key: native-fixtures-ios-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'aot-compatibility.json', 'wasmline-plugin-core/src/main/resources/META-INF/wasmline/aot/aot-compatibility-lock.json', 'wasmline-plugin-core/src/main/resources/META-INF/wasmline/toolchain/toolchain-lock.json', 'wasmline-native-test-fixtures/src/**') }}

      - name: Download locked iOS Pulley assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/wasmline wasmtime download
          --target ios-simulator-arm64
          --engine pulley

      - name: Run iOS Pulley native AOT gate
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./gradlew :wasmline:iosSimulatorArm64Test
          :wasmline-loader:iosSimulatorArm64Test
          -Pwasmline.native.fixtures.targets=pulley64
          -Pwasmline.native.fixtures.ids=raw-export-basic,component-typed-host
          --no-daemon

  create-release:
    name: create-github-release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download release inputs
        uses: actions/download-artifact@v4
        with:
          name: wasmline-release-inputs
          path: build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: wasmline ${{ needs.validate.outputs.version }}
          body_path: build/release-notes.md
          files: |
            build/release/aot-compatibility.json
            build/release/aot-compatibility.json.sha256
            build/release/wasmline.wit
            build/release/wasmline.wit.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.make_latest }}
