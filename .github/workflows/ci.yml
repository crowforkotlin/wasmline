# CI: Lint Checks, Build Verification & Test Execution
name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "*.md", ".agents/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["docs/**", "*.md", ".agents/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint-kotlin:
    runs-on: ubuntu-latest
    name: lint-kotlin

    steps:
      - uses: actions/checkout@v5

      - name: Restore ktlint cache
        uses: actions/cache@v5
        with:
          path: build/tools/ktlint
          key: ktlint-${{ runner.os }}-${{ hashFiles('versions.json') }}

      - name: Kotlin format check
        run: ./scripts/wasmline lint --all kotlin

  lint-clang:
    runs-on: ubuntu-latest
    name: lint-clang

    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: C/C++ format check
        run: ./scripts/wasmline lint --all cpp

  lint-zig:
    runs-on: ubuntu-latest
    name: lint-zig

    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Zig format and AST check
        run: ./scripts/wasmline lint --all zig

  # ───────────────────────────────────────────────────────────────
  # Native Asset Builds (run in parallel)
  # ───────────────────────────────────────────────────────────────

  build-cranelift-assets:
    runs-on: ubuntu-latest
    name: build-cranelift-assets

    steps:
      - uses: actions/checkout@v5

      # ── Toolchain Setup ──────────────────────────────────────────

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install MinGW-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64

      - name: Setup Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      # ── Environment Variables ────────────────────────────────────

      - name: Export build environment
        run: |
          echo "MINGW_PATH=/usr/x86_64-w64-mingw32" >> "$GITHUB_ENV"

      # ── Native Asset Build (with cache) ────────────────────────────

      - name: Cache Cranelift Wasmtime platform assets
        id: cache-wasmtime-cranelift
        uses: actions/cache@v5
        with:
          path: build/platforms
          key: wasmtime-platforms-cranelift-${{ hashFiles('versions.json', 'scripts/config/wasmtime-targets.json') }}

      - name: Initialize Cranelift Wasmtime platform assets
        if: steps.cache-wasmtime-cranelift.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/wasmline wasmtime download --engine cranelift

      - name: Build Cranelift native libraries
        timeout-minutes: 10
        run: ./scripts/wasmline jni build --engine cranelift

      - name: Upload Linux x64 Cranelift JNI library
        uses: actions/upload-artifact@v4
        with:
          name: jni-cranelift-linux-x64
          path: wasmline-multiplatform/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64/libwasmline.so
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-pulley-assets:
    runs-on: ubuntu-latest
    name: build-pulley-assets

    steps:
      - uses: actions/checkout@v5

      # ── Toolchain Setup ──────────────────────────────────────────

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install MinGW-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64

      - name: Setup Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      # ── Environment Variables ────────────────────────────────────

      - name: Export build environment
        run: |
          echo "MINGW_PATH=/usr/x86_64-w64-mingw32" >> "$GITHUB_ENV"

      # ── Native Asset Build (with cache) ──────────────────────────

      - name: Cache Pulley Wasmtime platform assets
        id: cache-wasmtime-pulley
        uses: actions/cache@v5
        with:
          path: build/platforms
          key: wasmtime-platforms-pulley-${{ hashFiles('versions.json', 'scripts/config/wasmtime-targets.json') }}

      - name: Initialize Pulley Wasmtime platform assets
        if: steps.cache-wasmtime-pulley.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/wasmline wasmtime download --engine pulley

      - name: Build Pulley native libraries
        timeout-minutes: 10
        run: ./scripts/wasmline jni build --engine pulley

  # ───────────────────────────────────────────────────────────────
  # JVM / Desktop Tests
  # ───────────────────────────────────────────────────────────────

  test-jvm:
    needs: build-cranelift-assets
    runs-on: ubuntu-latest
    name: test-jvm

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Download Cranelift JNI library
        uses: actions/download-artifact@v4
        with:
          name: jni-cranelift-linux-x64
          path: wasmline-multiplatform/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64

      - name: Run JVM tests
        working-directory: wasmline-multiplatform
        env:
          WASMLINE_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/wasmline-multiplatform/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64/libwasmline.so
        run: |
          ./gradlew :wasmline-kotlin-plugin:generateTests \
                    :wasmline-kotlin-plugin:test \
                    :wasmline-loader:jvmTest \
                    :wasmline:jvmTest \
                    :wasmline-cli:test \
                    --no-daemon

  test-native-aot-jvm:
    needs: build-cranelift-assets
    runs-on: ubuntu-latest
    name: test-native-aot-jvm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Rust Component target
        run: rustup target add wasm32-wasip2

      - name: Cache native fixture tools and compilers
        uses: actions/cache@v5
        with:
          path: |
            ~/.wasmline/tools
            ~/.wasmline/toolchains/wasmtime/compiler-assets
            ~/.cargo/registry
            ~/.cargo/git
          key: native-fixtures-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'aot-compatibility.json', 'wasmline-multiplatform/wasmline-plugin-core/src/main/resources/META-INF/wasmline/aot/aot-compatibility-lock.json', 'wasmline-multiplatform/wasmline-plugin-core/src/main/resources/META-INF/wasmline/toolchain/toolchain-lock.json', 'wasmline-multiplatform/wasmline-native-test-fixtures/src/**') }}

      - name: Download Cranelift JNI library
        uses: actions/download-artifact@v4
        with:
          name: jni-cranelift-linux-x64
          path: wasmline-multiplatform/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64

      - name: Run native AOT JVM tests
        working-directory: wasmline-multiplatform
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WASMLINE_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/wasmline-multiplatform/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64/libwasmline.so
        run: >-
          ./gradlew :wasmline:nativeAotJvmTest
          -Pwasmline.native.fixtures.targets=x86_64-linux,pulley64
          --no-daemon

  # ───────────────────────────────────────────────────────────────
  # Kotlin/Native Host Sample
  # ───────────────────────────────────────────────────────────────

  test-kotlin-native:
    runs-on: ubuntu-latest
    name: test-kotlin-native

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Linux x64 Pulley Wasmtime platform assets
        id: cache-wasmtime-kotlin-native
        uses: actions/cache@v5
        with:
          path: build/platforms
          key: wasmtime-platforms-kotlin-native-linux-x64-pulley-${{ hashFiles('versions.json', 'scripts/config/wasmtime-targets.json') }}

      - name: Initialize Linux x64 Pulley Wasmtime platform assets
        if: steps.cache-wasmtime-kotlin-native.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/wasmline wasmtime download
          --target linux-x64
          --engine pulley

      - name: Run Kotlin/Native sample
        working-directory: wasmline-samples/kotlin
        run: ./gradlew :sample-apps:native:verifyKotlinNativeSample --no-daemon

  # ───────────────────────────────────────────────────────────────
  # Web Browser Tests (wasmJs / js)
  # ───────────────────────────────────────────────────────────────

  test-web:
    runs-on: ubuntu-latest
    name: test-web

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run browser tests (wasmJs / js)
        working-directory: wasmline-multiplatform
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          ./gradlew :kotlinUpgradeYarnLock \
                    :wasmline:wasmJsBrowserTest \
                    :wasmline:jsBrowserTest \
                    :wasmline-loader:wasmJsBrowserTest \
                    :wasmline-loader:jsBrowserTest \
                    --no-daemon

  # ───────────────────────────────────────────────────────────────
  # wasmWasi Tests (Node.js)
  # ───────────────────────────────────────────────────────────────

  test-node:
    runs-on: ubuntu-latest
    name: test-node

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run wasmWasi Node.js tests
        working-directory: wasmline-multiplatform
        run: ./gradlew :wasmline:wasmWasiNodeTest --no-daemon

  # ───────────────────────────────────────────────────────────────
  # iOS Simulator Tests (macOS runner, Xcode pre-installed)
  # ───────────────────────────────────────────────────────────────

  test-ios:
    runs-on: macos-latest
    name: test-ios
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Wasmtime iOS platform assets
        id: cache-wasmtime-ios
        uses: actions/cache@v5
        with:
          path: build/platforms
          key: wasmtime-platforms-ios-${{ hashFiles('versions.json', 'scripts/config/wasmtime-targets.json') }}

      - name: Install Rust Component target
        run: rustup target add wasm32-wasip2

      - name: Cache native fixture tools, compilers, and Cargo data
        uses: actions/cache@v5
        with:
          path: |
            ~/.wasmline/tools
            ~/.wasmline/toolchains/wasmtime/compiler-assets
            ~/.cargo/registry
            ~/.cargo/git
          key: native-fixtures-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'aot-compatibility.json', 'wasmline-multiplatform/wasmline-plugin-core/src/main/resources/META-INF/wasmline/aot/aot-compatibility-lock.json', 'wasmline-multiplatform/wasmline-plugin-core/src/main/resources/META-INF/wasmline/toolchain/toolchain-lock.json', 'wasmline-multiplatform/wasmline-native-test-fixtures/src/**') }}

      - name: Initialize Wasmtime iOS simulator assets
        if: steps.cache-wasmtime-ios.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/wasmline wasmtime download
          --target ios-simulator-arm64
          --engine pulley

      - name: Run iOS simulator tests
        working-directory: wasmline-multiplatform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew :wasmline:iosSimulatorArm64Test \
                    :wasmline-loader:iosSimulatorArm64Test \
                    -Pwasmline.native.fixtures.targets=pulley64 \
                    -Pwasmline.native.fixtures.ids=raw-export-basic,component-typed-host \
                    --no-daemon

  # ───────────────────────────────────────────────────────────────
  # Wasmline Plugin Integration Tests
  # ───────────────────────────────────────────────────────────────

  test-plugin:
    needs: build-cranelift-assets
    runs-on: ubuntu-latest
    name: test-plugin

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Download Cranelift JNI library
        uses: actions/download-artifact@v4
        with:
          name: jni-cranelift-linux-x64
          path: wasmline-multiplatform/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64

      - name: Cache plugin Wasmtime binary
        uses: actions/cache@v5
        with:
          path: wasmline-multiplatform/wasmline-plugin-test/build/wasmline/wasmtime/
          key: plugin-wasmtime-${{ runner.os }}-${{ hashFiles('versions.json', 'scripts/config/wasmtime-targets.json', 'wasmline-multiplatform/wasmline-plugin-test/build.gradle.kts') }}

      - name: Run plugin integration tests
        working-directory: wasmline-multiplatform/wasmline-plugin-test
        env:
          WASMLINE_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/wasmline-multiplatform/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64/libwasmline.so
        run: ./gradlew jvmTest --no-daemon -Pgithub.token="${{ github.token }}"
