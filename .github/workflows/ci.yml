# CI: Lint Checks, Build Verification & Test Execution
name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "*.md", ".agents/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["docs/**", "*.md", ".agents/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.15.1"

jobs:
  lint-kotlin:
    runs-on: ubuntu-latest
    name: Kotlin Format Check

    steps:
      - uses: actions/checkout@v4

      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: ktlint check
        working-directory: wasmline-multiplatform
        run: ktlint --relative '!**/wasmline-build-logic/**' '!**/iosMain/**' '!**/build/**'

  lint-clang:
    runs-on: ubuntu-latest
    name: C++ Format Check

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: clang-format check
        run: |
          find wasmline-core/src wasmline-core/include -name '*.cpp' -o -name '*.h' | \
            xargs clang-format --dry-run --Werror

  # ───────────────────────────────────────────────────────────────
  # JOB 3: Compile all targets (requires native libraries)
  # ───────────────────────────────────────────────────────────────

  compile-all:
    needs: [lint-kotlin, lint-clang]
    if: ${{ always() && (needs.lint-kotlin.result == 'success' || needs.lint-clang.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    name: Compile All Targets

    steps:
      - uses: actions/checkout@v4

      # ── Toolchain Setup ──────────────────────────────────────────

      - name: Setup JBR 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install MinGW-w64 and clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 clang-format

      - name: Setup Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      # ── Environment Variables ────────────────────────────────────

      - name: Export build environment
        run: |
          echo "MINGW_PATH=/usr/x86_64-w64-mingw32" >> "$GITHUB_ENV"

      # ── Native Asset Build (blocking step) ────────────────────────
      # Only starts after lint checks pass (or fail-fast)

      - name: Initialize Wasmtime platform assets
        run: printf "\na\n\n" | bash scripts/init-wasmtime.sh

      - name: Build native libraries
        timeout-minutes: 5
        run: bash scripts/build-native-assets.sh

      - name: Upload native assets
        uses: actions/upload-artifact@v4
        with:
          name: native-assets
          path: |
            build/platforms/
            wasmline-multiplatform/wasmline/src/jvmMain/resources/jni/
          retention-days: 1

      # ── Compilation (Format checks already passed in lint-* jobs) ────

      - name: Compile all JVM & Multiplatform targets
        working-directory: wasmline-multiplatform
        run: |
          ./gradlew compileKotlinJvm \
                    compileAndroidMain \
                    compileKotlinWasmJs \
                    compileKotlinJs \
                    compileKotlinWasmWasi \
                    --no-daemon

  # ───────────────────────────────────────────────────────────────
  # JOB 4: Execute Tests (requires successful compilation)
  # ───────────────────────────────────────────────────────────────

  test-all:
    needs: compile-all
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Run All Tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup JBR 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Download native assets
        uses: actions/download-artifact@v4
        with:
          name: native-assets

      - name: Kotlin compiler plugin box tests
        working-directory: wasmline-multiplatform
        run: |
          ./gradlew :wasmline-kotlin-plugin:generateTests \
                    :wasmline-kotlin-plugin:test \
                    --no-daemon

      - name: Loader module jvmTest
        working-directory: wasmline-multiplatform
        run: ./gradlew :wasmline-loader:jvmTest --no-daemon
