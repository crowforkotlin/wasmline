# CI: Lint Checks, Build Verification & Test Execution
name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "*.md", ".agents/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["docs/**", "*.md", ".agents/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.15.1"

jobs:
  lint-kotlin:
    runs-on: ubuntu-latest
    name: lint-kotlin

    steps:
      - uses: actions/checkout@v5

      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: ktlint check
        working-directory: wasmline-multiplatform
        run: ktlint --relative '!**/wasmline-build-logic/**' '!**/iosMain/**' '!**/build/**'

  lint-clang:
    runs-on: ubuntu-latest
    name: lint-clang

    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: clang-format check
        run: |
          find wasmline-core/src wasmline-core/include -name '*.cpp' -o -name '*.h' | \
            xargs clang-format --dry-run --Werror

  # ───────────────────────────────────────────────────────────────
  # JOB 3: Compile all targets (parallel with lint, requires native libraries)
  # ───────────────────────────────────────────────────────────────

  compile-all:
    runs-on: ubuntu-latest
    name: compile

    steps:
      - uses: actions/checkout@v5

      # ── Toolchain Setup ──────────────────────────────────────────

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Cache JBR 21 for iOS tests
        id: cache-jbr-21
        uses: actions/cache@v5
        with:
          path: ${{ env.JAVA_HOME }}
          key: jbr-21-${{ runner.os }}-${{ github.sha }}
          lookback-period: 7
          fail-on-cache-miss: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install MinGW-w64 and clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 clang-format

      - name: Setup Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      # ── Environment Variables ────────────────────────────────────

      - name: Export build environment
        run: |
          echo "MINGW_PATH=/usr/x86_64-w64-mingw32" >> "$GITHUB_ENV"

      # ── Native Asset Build (with cache) ────────────────────────────

      - name: Cache Wasmtime platform assets
        id: cache-wasmtime
        uses: actions/cache@v5
        with:
          path: build/platforms
          key: wasmtime-platforms-${{ hashFiles('scripts/versions.json') }}

      - name: Initialize Wasmtime platform assets
        if: steps.cache-wasmtime.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf "\na\n\n" | bash scripts/init-wasmtime.sh

      - name: Build native libraries
        timeout-minutes: 5
        run: bash scripts/build-native-assets.sh

      - name: Deploy JVM native library for tests
        run: |
          mkdir -p wasmline-multiplatform/wasmline/src/jvmMain/resources/jni/linux/x86_64
          cp wasmline-multiplatform/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64/libwasmline.so \
             wasmline-multiplatform/wasmline/src/jvmMain/resources/jni/linux/x86_64/libwasmline.so

      - name: Cache native assets for test job
        uses: actions/cache/save@v5
        with:
          path: wasmline-multiplatform/wasmline/src/jvmMain/resources/jni/
          key: native-assets-${{ github.run_id }}

      # ── Compilation ────────────────────────────────────────────────

      - name: Compile all JVM & Multiplatform targets
        working-directory: wasmline-multiplatform
        run: |
          ./gradlew compileKotlinJvm \
                    compileAndroidMain \
                    compileKotlinWasmJs \
                    compileKotlinJs \
                    compileKotlinWasmWasi \
                    --no-daemon

  # ───────────────────────────────────────────────────────────────
  # JOB 4: JVM / Desktop Tests
  # ───────────────────────────────────────────────────────────────

  test-jvm:
    needs: compile-all
    runs-on: ubuntu-latest
    name: test-jvm

    steps:
      - uses: actions/checkout@v5

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Cache JBR 21 for iOS tests
        id: cache-jbr-21
        uses: actions/cache@v5
        with:
          path: ${{ env.JAVA_HOME }}
          key: jbr-21-${{ runner.os }}-${{ github.sha }}
          lookback-period: 7
          fail-on-cache-miss: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore native assets from cache
        uses: actions/cache/restore@v4
        with:
          path: wasmline-multiplatform/wasmline/src/jvmMain/resources/jni/
          key: native-assets-${{ github.run_id }}

      - name: Run JVM tests
        working-directory: wasmline-multiplatform
        run: |
          ./gradlew :wasmline-kotlin-plugin:generateTests \
                    :wasmline-kotlin-plugin:test \
                    :wasmline-loader:jvmTest \
                    :wasmline:jvmTest \
                    :wasmline-cli:test \
                    --no-daemon

  # ───────────────────────────────────────────────────────────────
  # JOB 5: Web Browser Tests (wasmJs / js)
  # ───────────────────────────────────────────────────────────────

  test-web:
    needs: compile-all
    runs-on: ubuntu-latest
    name: test-web

    steps:
      - uses: actions/checkout@v5

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Cache JBR 21 for iOS tests
        id: cache-jbr-21
        uses: actions/cache@v5
        with:
          path: ${{ env.JAVA_HOME }}
          key: jbr-21-${{ runner.os }}-${{ github.sha }}
          lookback-period: 7
          fail-on-cache-miss: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run browser tests (wasmJs / js)
        working-directory: wasmline-multiplatform
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          ./gradlew :kotlinUpgradeYarnLock \
                    :wasmline:wasmJsBrowserTest \
                    :wasmline:jsBrowserTest \
                    :wasmline-loader:wasmJsBrowserTest \
                    :wasmline-loader:jsBrowserTest \
                    --no-daemon

      - name: Upload Web Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results-${{ github.run_id }}
          path: |
            wasmline-multiplatform/wasmline/build/reports/tests/*Test/index.html
            wasmline-multiplatform/wasmline/build/test-results/*/TEST-*.xml
            wasmline-multiplatform/wasmline-loader/build/reports/tests/*Test/index.html
            wasmline-multiplatform/wasmline-loader/build/test-results/*/TEST-*.xml
          retention-days: 7
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────
  # JOB 6: wasmWasi Tests (Node.js)
  # ───────────────────────────────────────────────────────────────

  test-node:
    needs: compile-all
    runs-on: ubuntu-latest
    name: test-node

    steps:
      - uses: actions/checkout@v5

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Cache JBR 21 for iOS tests
        id: cache-jbr-21
        uses: actions/cache@v5
        with:
          path: ${{ env.JAVA_HOME }}
          key: jbr-21-${{ runner.os }}-${{ github.sha }}
          lookback-period: 7
          fail-on-cache-miss: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run wasmWasi Node.js tests
        working-directory: wasmline-multiplatform
        run: ./gradlew :wasmline:wasmWasiNodeTest --no-daemon

  # ───────────────────────────────────────────────────────────────
  # JOB 7: iOS Simulator Tests (macOS runner, Xcode pre-installed)
  # ───────────────────────────────────────────────────────────────

  test-ios:
    needs: compile-all
    runs-on: macos-latest
    name: test-ios

    steps:
      - uses: actions/checkout@v5

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Cache JBR 21 for iOS tests
        id: cache-jbr-21
        uses: actions/cache@v5
        with:
          path: ${{ env.JAVA_HOME }}
          key: jbr-21-${{ runner.os }}-${{ github.sha }}
          lookback-period: 7
          fail-on-cache-miss: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Wasmtime iOS platform assets
        id: cache-wasmtime-ios
        uses: actions/cache@v5
        with:
          path: build/platforms
          key: wasmtime-platforms-ios-${{ hashFiles('scripts/versions.json') }}

      - name: Initialize Wasmtime iOS simulator assets
        if: steps.cache-wasmtime-ios.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WASM_VERSION: release-v45.0.6
        run: bash scripts/init-wasmtime-ci.sh

      - name: Run iOS simulator tests
        working-directory: wasmline-multiplatform
        run: |
          ./gradlew :wasmline:iosSimulatorArm64Test \
                    :wasmline-loader:iosSimulatorArm64Test \
                    --no-daemon

  # ───────────────────────────────────────────────────────────────
  # JOB 7: Publish to Maven Central (placeholder, runs after all jobs)
  # ───────────────────────────────────────────────────────────────

  publish:
    needs: [lint-kotlin, lint-clang, compile-all, test-jvm, test-web, test-node, test-ios]
    runs-on: ubuntu-latest
    name: publish

    steps:
      - name: Placeholder
        run: echo "Publish to Maven Central — not yet implemented."

  # ───────────────────────────────────────────────────────────────
  # JOB 8: GitHub Release (placeholder, runs after all jobs)
  # ───────────────────────────────────────────────────────────────

  release:
    needs: [lint-kotlin, lint-clang, compile-all, test-jvm, test-web, test-node, test-ios]
    runs-on: ubuntu-latest
    name: release

    steps:
      - name: Placeholder
        run: echo "Create GitHub Release with changelog — not yet implemented."
