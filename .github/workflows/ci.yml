# CI: Lint Checks, Build Verification & Test Execution
name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "*.md", ".agents/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["docs/**", "*.md", ".agents/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint-kotlin:
    runs-on: ubuntu-latest
    name: lint-kotlin

    steps:
      - uses: actions/checkout@v5

      - name: Restore ktlint cache
        uses: actions/cache@v5
        with:
          path: build/tools/ktlint
          key: ktlint-${{ runner.os }}-${{ hashFiles('scripts/versions.json') }}

      - name: Kotlin format check
        run: bash scripts/lint.sh --all kotlin

  lint-clang:
    runs-on: ubuntu-latest
    name: lint-clang

    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: C/C++ format check
        run: bash scripts/lint.sh --all cpp

  lint-zig:
    runs-on: ubuntu-latest
    name: lint-zig

    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Zig format and AST check
        run: bash scripts/lint.sh --all zig

  # ───────────────────────────────────────────────────────────────
  # JOB 3: Build native assets (Wasmtime platform libraries)
  # ───────────────────────────────────────────────────────────────

  build-assets:
    runs-on: ubuntu-latest
    name: build-assets

    steps:
      - uses: actions/checkout@v5

      # ── Toolchain Setup ──────────────────────────────────────────

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install MinGW-w64 and clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 clang-format

      - name: Setup Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      # ── Environment Variables ────────────────────────────────────

      - name: Export build environment
        run: |
          echo "MINGW_PATH=/usr/x86_64-w64-mingw32" >> "$GITHUB_ENV"

      # ── Native Asset Build (with cache) ────────────────────────────

      - name: Cache Wasmtime platform assets
        id: cache-wasmtime
        uses: actions/cache@v5
        with:
          path: build/platforms
          key: wasmtime-platforms-${{ hashFiles('scripts/versions.json') }}

      - name: Initialize Wasmtime platform assets
        if: steps.cache-wasmtime.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WASMTIME_VERSION: ${{ vars.WASMTIME_VERSION || 'release-v47.0.2' }}
        run: |
          echo "Initializing Wasmtime $WASMTIME_VERSION..."
          # Select the configured release, all platforms, and default concurrency.
          printf "%s\na\n\n" "$WASMTIME_VERSION" | bash scripts/init-wasmtime.sh

      - name: Build native libraries
        timeout-minutes: 5
        run: bash scripts/build-native-assets.sh

      - name: Deploy JVM native library for tests
        run: |
          mkdir -p wasmline-multiplatform/wasmline/src/jvmMain/resources/jni/linux/x86_64
          cp wasmline-multiplatform/wasmline-engine-cranelift/src/jvmMain/resources/jni/linux/x86_64/libwasmline.so \
             wasmline-multiplatform/wasmline/src/jvmMain/resources/jni/linux/x86_64/libwasmline.so

      - name: Cache native assets for test job
        uses: actions/cache/save@v5
        with:
          path: wasmline-multiplatform/wasmline/src/jvmMain/resources/jni/
          key: native-assets-${{ github.run_id }}

  # ───────────────────────────────────────────────────────────────
  # JOB 4: JVM / Desktop Tests
  # ───────────────────────────────────────────────────────────────

  test-jvm:
    needs: build-assets
    runs-on: ubuntu-latest
    name: test-jvm

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore native assets from cache
        uses: actions/cache/restore@v4
        with:
          path: wasmline-multiplatform/wasmline/src/jvmMain/resources/jni/
          key: native-assets-${{ github.run_id }}

      - name: Run JVM tests
        working-directory: wasmline-multiplatform
        run: |
          ./gradlew :wasmline-kotlin-plugin:generateTests \
                    :wasmline-kotlin-plugin:test \
                    :wasmline-loader:jvmTest \
                    :wasmline:jvmTest \
                    :wasmline-cli:test \
                    --no-daemon

  # Kotlin/Native host sample

  test-kotlin-native:
    needs: build-assets
    runs-on: ubuntu-latest
    name: test-kotlin-native

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore Wasmtime platform assets
        uses: actions/cache/restore@v5
        with:
          path: build/platforms
          key: wasmtime-platforms-${{ hashFiles('scripts/versions.json') }}
          fail-on-cache-miss: true

      - name: Run Kotlin/Native sample
        working-directory: wasmline-samples/kotlin
        run: ./gradlew :sample-apps:native:verifyKotlinNativeSample --no-daemon

  # ───────────────────────────────────────────────────────────────
  # JOB 5: Web Browser Tests (wasmJs / js)
  # ───────────────────────────────────────────────────────────────

  test-web:
    needs: build-assets
    runs-on: ubuntu-latest
    name: test-web

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run browser tests (wasmJs / js)
        working-directory: wasmline-multiplatform
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          ./gradlew :kotlinUpgradeYarnLock \
                    :wasmline:wasmJsBrowserTest \
                    :wasmline:jsBrowserTest \
                    :wasmline-loader:wasmJsBrowserTest \
                    :wasmline-loader:jsBrowserTest \
                    --no-daemon

  # ───────────────────────────────────────────────────────────────
  # JOB 6: wasmWasi Tests (Node.js)
  # ───────────────────────────────────────────────────────────────

  test-node:
    needs: build-assets
    runs-on: ubuntu-latest
    name: test-node

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run wasmWasi Node.js tests
        working-directory: wasmline-multiplatform
        run: ./gradlew :wasmline:wasmWasiNodeTest --no-daemon

  # ───────────────────────────────────────────────────────────────
  # JOB 7: iOS Simulator Tests (macOS runner, Xcode pre-installed)
  # ───────────────────────────────────────────────────────────────

  test-ios:
    needs: build-assets
    runs-on: macos-latest
    name: test-ios

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Wasmtime iOS platform assets
        id: cache-wasmtime-ios
        uses: actions/cache@v5
        with:
          path: build/platforms
          key: wasmtime-platforms-ios-${{ hashFiles('scripts/versions.json') }}

      - name: Initialize Wasmtime iOS simulator assets
        if: steps.cache-wasmtime-ios.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WASMTIME_VERSION: ${{ vars.WASMTIME_VERSION || 'release-v47.0.2' }}
        run: |
          echo "Initializing Wasmtime $WASMTIME_VERSION for iOS Simulator..."
          # Select the configured release, iOS simulator target, and default concurrency.
          printf "%s\n6\n\n" "$WASMTIME_VERSION" | bash scripts/init-wasmtime.sh

      - name: Run iOS simulator tests
        working-directory: wasmline-multiplatform
        run: |
          ./gradlew :wasmline:iosSimulatorArm64Test \
                    :wasmline-loader:iosSimulatorArm64Test \
                    --no-daemon

  # ───────────────────────────────────────────────────────────────
  # JOB 8: Wasmline Plugin Integration Tests
  # ───────────────────────────────────────────────────────────────

  test-plugin:
    needs: build-assets
    runs-on: ubuntu-latest
    name: test-plugin

    steps:
      - uses: actions/checkout@v5

      - name: Cache JBR 21
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/Java_JetBrains_jdk
          key: jbr-21-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: false

      - name: Setup JBR 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: 21.x
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore native assets from cache
        uses: actions/cache/restore@v5
        with:
          path: wasmline-multiplatform/wasmline/src/jvmMain/resources/jni/
          key: native-assets-${{ github.run_id }}

      - name: Cache plugin Wasmtime binary
        uses: actions/cache@v5
        with:
          path: wasmline-multiplatform/wasmline-plugin-test/build/wasmline/wasmtime/
          key: plugin-wasmtime-${{ runner.os }}-${{ hashFiles('scripts/versions.json', 'wasmline-multiplatform/wasmline-plugin-test/build.gradle.kts') }}

      - name: Run plugin integration tests
        working-directory: wasmline-multiplatform/wasmline-plugin-test
        run: ./gradlew jvmTest --no-daemon -Pgithub.token="${{ github.token }}"
