# Build and deploy Next.js docs to GitHub Pages
name: Deploy Docs

on:
  # Trigger on main branch changes for docs folder
  push:
    branches: ["main"]
    paths: ["docs/**", ".github/workflows/deploy-docs.yml"]
  # Allow manual run
  workflow_dispatch:

# Set deployment permissions
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build Job
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
          cache: true
          cache_dependency_path: docs/pnpm-lock.yaml
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/out

  # Deploy Job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
