[package]
name = "wasmline-rpc-rust-fixture"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { git = "https://github.com/crowforkotlin/wit-bindgen.git", tag = "v0.57.1" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
